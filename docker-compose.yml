services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident}
      POSTGRES_DB: ${POSTGRES_DB:-incident_db}
    ports:
      - '5432:5432'
    volumes:
      - incident_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-incident}']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate-seed:
    build:
      context: .
      target: migrate-seed
    restart: 'no'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:-incident}@postgres:5432/${POSTGRES_DB:-incident_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:-incident}@postgres:5432/${POSTGRES_DB:-incident_db}?schema=public
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - incident_api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      migrate-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/v1/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../incident-web
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - '5173:5173'
    volumes:
      - ../incident-web:/app
      - incident_web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  incident_pg_data:
  incident_api_node_modules:
  incident_web_node_modules:
